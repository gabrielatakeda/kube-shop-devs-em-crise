---
# Entrega 2 / S1: autenticação por senha e login direto como root desativados.
# O arquivo 00-* é lido antes dos demais em sshd_config.d (o primeiro valor vence).

- name: Aplica configuração endurecida do SSH
  ansible.builtin.template:
    src: 00-kubeshop-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-kubeshop-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reinicia ssh

- name: Garante que o sshd_config principal inclui o diretório sshd_config.d
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include /etc/ssh/sshd_config.d/\*\.conf'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reinicia ssh

- name: Aplica a nova configuração antes de seguir
  ansible.builtin.meta: flush_handlers
