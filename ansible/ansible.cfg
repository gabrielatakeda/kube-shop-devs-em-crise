[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = ubuntu
interpreter_python = /usr/bin/python3
forks = 5
timeout = 30
# Logs legíveis na pipeline.
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = profile_tasks
# Segredos nunca devem aparecer: as tasks sensíveis usam no_log.
display_skipped_hosts = false
retry_files_enabled = false

[ssh_connection]
pipelining = true
# VMs são recriadas pela pipeline: aceita a chave do host na primeira conexão,
# mas recusa se ela mudar depois (accept-new, em vez de desligar a verificação).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15
